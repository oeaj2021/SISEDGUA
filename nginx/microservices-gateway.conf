# =============================================================================
# SISEDGUA - API GATEWAY REVERSE PROXY NGINX CONFIG
# Enrutamiento de microservicios con balanceo, compresión y buffers optimizados
# =============================================================================

upstream auth_cluster {
    server auth-service:3001;
    keepalive 32;
}

upstream reporte_cluster {
    server reporte-service:3002;
    keepalive 64;
}

upstream institucion_cluster {
    server institucion-service:3003;
    keepalive 64;
}

upstream padron_cluster {
    server padron-service:3004;
    keepalive 32;
}

upstream analytics_cluster {
    server analytics-service:3006;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Compresión perimetral
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Headers de Proxy y Seguridad
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Rutas de Autenticación
    location /api/auth/ {
        proxy_pass http://auth_cluster;
    }

    # 2. Rutas de Ingesta de Reportes
    location /api/reportes/ {
        proxy_pass http://reporte_cluster;
    }

    # 3. Rutas de Catálogo Escolar
    location /api/instituciones/ {
        proxy_pass http://institucion_cluster;
    }

    # 4. Rutas de Padrón y Consulta
    location /api/padron/ {
        proxy_pass http://padron_cluster;
    }

    # 5. Rutas de Métricas y Analítica
    location /api/dashboard/ {
        proxy_pass http://analytics_cluster;
    }

    # 6. Health Check Gateway
    location /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"sisedgua_nginx"}';
        add_header Content-Type application/json;
    }
}
