services:
  # Base de Datos PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: sisedgua_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sisedgua}
      POSTGRES_USER: ${DB_USER:-sisedgua_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-557f49dc843f5fe53b04c860103b28b0}
      TZ: America/Caracas
    volumes:
      - sisedgua_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sisedgua_admin} -d ${DB_NAME:-sisedgua}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache en Memoria y Rate Limiting Distribuido con Redis 7
  redis:
    image: redis:7-alpine
    container_name: sisedgua_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - sisedgua_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend Node.js / Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisedgua_backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sisedgua}
      DB_USER: ${DB_USER:-sisedgua_admin}
      DB_PASS: ${DB_PASS:-557f49dc843f5fe53b04c860103b28b0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-a68c7a75d1e8f02751941bb26ba5d1fe056b55b0301d40f7178ab4738cdec51a}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@sisedgua.ve}
      DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:-okmLIqlAFOWzIg@2026!}
      DEFAULT_ADMIN_NAME: "Administrador Sala Situacional CDCE ESTADAL GUÁRICO"
      TZ: America/Caracas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Web (React SPA + Reverse Proxy Nginx para Dokploy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sisedgua_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  sisedgua_pgdata:
    driver: local
  sisedgua_redisdata:
    driver: local
