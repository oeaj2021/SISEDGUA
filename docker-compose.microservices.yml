version: '3.8'

# =============================================================================
# SISEDGUA - ARQUITECTURA DE MICROSERVICIOS DE ALTA ESCALA (40K - 100K USUARIOS)
# CDCE Estadal Guárico | Despliegue Multi-Contenedor Desacoplado
# =============================================================================

services:
  # -------------------------------------------------------------
  # 1. API GATEWAY & REVERSE PROXY
  # -------------------------------------------------------------
  api-gateway:
    image: nginx:1.25-alpine
    container_name: sisedgua_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/microservices-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - reporte-service
      - institucion-service
      - analytics-service
      - padron-service
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 2. MESSAGE BROKER & DISTRIBUTED CACHE
  # -------------------------------------------------------------
  redis-broker:
    image: redis:7-alpine
    container_name: sisedgua_redis_broker
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 3. BASE DE DATOS CENTRALIZADA (SCHEMA-PER-SERVICE)
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: sisedgua_postgres_db
    restart: always
    environment:
      POSTGRES_DB: sisedgua_db
      POSTGRES_USER: sisedgua
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sisedgua_secure_pass_2026}
    volumes:
      - postgres_cluster_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisedgua -d sisedgua_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 4. MICROSERVICIO DE AUTENTICACIÓN & IDENTIDAD
  # -------------------------------------------------------------
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/app.js"]
    environment:
      - PORT=3001
      - DB_NAME=sisedgua_db
      - DB_USER=sisedgua
      - DB_PASSWORD=${DB_PASSWORD:-sisedgua_secure_pass_2026}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-sisedgua_jwt_secret_token}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 5. MICROSERVICIO DE INGESTA DE REPORTES (WRITE-HEAVY)
  # -------------------------------------------------------------
  reporte-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/app.js"]
    environment:
      - PORT=3002
      - DB_NAME=sisedgua_db
      - DB_USER=sisedgua
      - DB_PASSWORD=${DB_PASSWORD:-sisedgua_secure_pass_2026}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
    deploy:
      replicas: 3
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 6. MICROSERVICIO DE CATÁLOGO ESCOLAR (READ-HEAVY)
  # -------------------------------------------------------------
  institucion-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/app.js"]
    environment:
      - PORT=3003
      - DB_NAME=sisedgua_db
      - DB_USER=sisedgua
      - DB_PASSWORD=${DB_PASSWORD:-sisedgua_secure_pass_2026}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
    deploy:
      replicas: 2
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 7. MICROSERVICIO DE PADRÓN DE PERSONAL
  # -------------------------------------------------------------
  padron-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/app.js"]
    environment:
      - PORT=3004
      - DB_NAME=sisedgua_db
      - DB_USER=sisedgua
      - DB_PASSWORD=${DB_PASSWORD:-sisedgua_secure_pass_2026}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - sisedgua_mesh

  # -------------------------------------------------------------
  # 8. MICROSERVICIO DE ANALÍTICAS SITUACIONALES (CQRS)
  # -------------------------------------------------------------
  analytics-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/app.js"]
    environment:
      - PORT=3006
      - DB_NAME=sisedgua_db
      - DB_USER=sisedgua
      - DB_PASSWORD=${DB_PASSWORD:-sisedgua_secure_pass_2026}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
    deploy:
      replicas: 2
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - sisedgua_mesh

volumes:
  postgres_cluster_data:
  redis_broker_data:

networks:
  sisedgua_mesh:
    driver: bridge
